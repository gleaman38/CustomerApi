name: CustomerApi CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CustomerApi.sln

    - name: Build
      run: dotnet build CustomerApi.sln --no-restore

    - name: Run tests
      run: dotnet test CustomerApi.sln --no-build