name: CustomerApi CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CustomerApi.sln

    - name: Build
      run: dotnet build CustomerApi.sln --no-restore

    - name: Run tests
      env:
        Jwt__Key: "ThisIsADevelopmentOnlySecretKey123456789"
      run: dotnet test CustomerApi.sln --no-build

    - name: Publish
      run: dotnet publish CustomerApi/CustomerApi.csproj -c Release -o ./publish

    - name: Upload published application
      uses: actions/upload-artifact@v4
      with:
        name: CustomerApi-publish
        path: ./publish
        
deploy:
  needs: build-and-test
  runs-on: ubuntu-latest
  
  steps:
    - name: Download published application
      uses: actions/download-artifact@v4
      with:
        name: CustomerApi-publish
        path: ./deployment
    - name: Simulate deployment
      run: |
        echo "Deploying CustomerApi..."
        ls -la ./deployment
        echo "Deployment completed successfully."
  
  
        
